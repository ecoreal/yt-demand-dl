[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-demand-dl"
version = "0.1.0"
description = "Demand-driven YouTube downloader built as a small orchestration layer over yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "yt-demand-dl contributors" }
]
keywords = ["youtube", "yt-dlp", "video", "dataset", "downloader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
download = ["yt-dlp>=2025.1.0"]
test = ["pytest>=8"]

[project.scripts]
yt-demand-dl = "yt_demand_dl.cli:main"
ytdemand = "yt_demand_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
